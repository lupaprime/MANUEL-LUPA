<style>
  :root{
    --green:#2c433d;
    --green2:#233732;
    --gold:#c99a4c;
    --cream:#f2ead9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    font-size:min(16px, 2.15vh);
    font-size:min(16px, 2.15dvh);
    height:100%;
  }
  body{ height:100%; }
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(160deg, var(--green) 0%, var(--green2) 100%);
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0.5rem;
    overflow:hidden;
  }
  .card{
    width:100%;
    max-width:400px;
    height:auto;
    max-height:100%;
    background:var(--cream);
    border-radius:1.25rem;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .header{
    background:var(--green2);
    padding:0.5rem 1.25rem 2.6rem;
    text-align:center;
    color:var(--cream);
    flex-shrink:0;
  }
  .logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.7rem;
  }
  .logo img{ height:3.2rem; width:auto; }
  .logo .name{
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:1px;
    color:var(--cream);
  }
  .logo .name span{ color:var(--gold); font-weight:400; }
  .profile{
    text-align:center;
    margin-top:-2.4rem;
    padding:0 1.25rem 0.5rem;
    flex-shrink:0;
  }
  .avatar{
    width:6.2rem;
    height:6.2rem;
    border-radius:0;
    object-fit:cover;
    display:block;
    margin:0 auto 0.5rem;
    border:0.28rem solid var(--cream);
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
  }
  .profile h1{
    font-size:1.75rem;
    font-weight:800;
    color:var(--green2) !important;
    margin-bottom:0.15rem;
  }
  .profile .role{
    font-size:1rem;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .profile .creci{
    font-size:0.7rem;
    font-weight:400;
    letter-spacing:0.03em;
    color:#000;
    margin-top:0.2rem;
  }
  .profile .creci b{ font-weight:800; color:#000; }
  .links{
    padding:0.75rem 1.125rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:0.55rem;
    flex-shrink:0;
  }
  .link{
    display:flex;
    align-items:center;
    gap:0.8125rem;
    padding:0.6rem 0.9rem;
    background:#fff;
    border-radius:0.8125rem;
    text-decoration:none;
    color:var(--green2);
    box-shadow:0 2px 8px rgba(20,30,25,0.06);
    border:1px solid #ece6d6;
    transition:transform .15s ease, box-shadow .15s ease;
    flex-shrink:0;
  }
  .link:active{ transform:scale(0.97); box-shadow:0 1px 4px rgba(20,30,25,0.08); }
  .icon{
    width:3.1rem;
    height:3.1rem;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon svg{ width:2.55rem; height:2.55rem; }
  .text{
    font-size:1.15rem;
    font-weight:400;
    color:var(--green2);
    flex:1;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .whatsapp .icon{ background:#25D366; }
  .whatsapp .icon svg{ width:2.1rem; height:2.1rem; }
  .site .icon{ background:linear-gradient(135deg, var(--green2), var(--green)); }
  .instagram .icon{ background:radial-gradient(circle at 30% 110%, #ffd776 0%, #f5a13a 20%, #e5433c 45%, #c22e78 70%, #7c3aed 100%); }
  .facebook .icon{ background:#1877F2; }
  .phone .icon{ background:var(--gold); }
  footer{
    text-align:center;
    padding:0.5rem 1.25rem 0.9rem;
    font-size:0.75rem;
    font-weight:800;
    letter-spacing:0.05em;
    color:#9a9488;
    flex-shrink:0;
  }

  /* --- Novo header: logo e foto lado a lado --- */
  .header{
    background:var(--green2);
    padding:1.1rem 4rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.9rem;
    flex-shrink:0;
  }
  .header .logo{ display:flex; align-items:center; }
  .header .logo img{ height:3.8rem; width:auto; }
  .header .photo-box{
    width:5.6rem;
    height:6.8rem;
    border-radius:0.6rem;
    overflow:hidden;
    border:0.18rem solid var(--cream);
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
    flex-shrink:0;
  }
  .header .photo-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile{
    text-align:center;
    margin-top:0 !important;padding:0.9rem 1.25rem 0.5rem;
    flex-shrink:0;
  }
</style>
</head>
